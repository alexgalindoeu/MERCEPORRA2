<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sures</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; color: #000; }
  #captura { padding: 10px; background: #f5f5f5; }
  .global { background: #fde79b; border: 2px solid #f5c518; border-radius: 10px; text-align: center;
            font-size: 24px; font-weight: 800; padding: 22px 10px; margin-bottom: 20px; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .col { background: #fff; border: 1px solid #ccc; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .col h2 { margin: 0; background: #ffcc00; text-align: center; font-size: 26px; padding: 16px 0; }
  .col .nombre { width: 100%; border: 0; background: #bcd6ee; text-align: center; font-size: 24px;
                 font-weight: 800; padding: 16px 8px; display: block; font-family: inherit; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { background: #f0f0f0; font-size: 16px; padding: 10px 2px; border: 1px solid #ddd; }
  td { padding: 6px 4px; border: 1px solid #eee; text-align: center; font-size: 20px; }
  td input, td select { width: 100%; padding: 8px 4px; border: 1px solid #ccc; border-radius: 6px;
                        text-align: center; font-size: 15px; background: #fff; font-family: inherit; }
  th:nth-child(1) { width: 25%; } th:nth-child(2) { width: 13%; } th:nth-child(3) { width: 25%; }
  th:nth-child(4) { width: 20%; } th:nth-child(5) { width: 17%; }
  .botones { display: flex; gap: 14px; justify-content: center; padding: 14px 0; }
  .botones button { border: 0; border-radius: 8px; padding: 12px 18px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .add { background: #e2e2e2; color: #1a73e8; } .del { background: #fde0e0; color: #b00020; }
  .resumen { background: #aad28f; padding: 14px 20px; margin-bottom: 0; }
  .resumen div { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800;
                 padding: 8px 0; border-bottom: 1px solid #8fb877; }
  .resumen .ben { color: #c00000; }
  .espacio { height: 24px; background: #fff; }
  .guardar { display: block; margin: 40px auto; background: #2f5223; color: #fff; border: 0; border-radius: 8px;
             padding: 18px 30px; font-size: 22px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="captura">
  <div class="global" id="global"></div>
  <div class="cols" id="cols"></div>
</div>
<button class="guardar" id="foto">📸 Guardar Foto de la Tabla</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const KEY = 'sures_v1';
const defecto = () => ({
  cols: [
    { titulo: '1', nombre: 'Equipo 1', filas: [{ b: '', t: 'R', i: '', c: '' }] },
    { titulo: 'X', nombre: 'EMPATE',   filas: [{ b: '', t: 'R', i: '', c: '' }], fijo: true },
    { titulo: '2', nombre: 'Equipo 2', filas: [{ b: '', t: 'R', i: '', c: '' }] },
  ]
});
let estado;
try { estado = JSON.parse(localStorage.getItem(KEY)) || defecto(); } catch (e) { estado = defecto(); }

const num = v => parseFloat(String(v).replace(',', '.')) || 0;
const fmt = n => n.toFixed(2);
// R: neto = importe * cuota   |   F (freebet): neto = importe * (cuota - 1)
const neto = f => f.t === 'F' ? num(f.i) * (num(f.c) - 1) : num(f.i) * num(f.c);
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch (e) {} };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

function totales(col) {
  let real = 0, fb = 0, profit = 0;
  col.filas.forEach(f => { (f.t === 'F' ? fb += num(f.i) : real += num(f.i)); profit += neto(f); });
  return { real, fb, profit };
}

function pintarCalculos() {
  const totalReal = estado.cols.reduce((s, c) => s + totales(c).real, 0);
  document.getElementById('global').textContent = `TOTAL INVERSIÓN REAL (GLOBAL): ${fmt(totalReal)} €`;
  estado.cols.forEach((col, ci) => {
    const t = totales(col);
    col.filas.forEach((f, fi) => { document.getElementById(`n${ci}_${fi}`).textContent = fmt(neto(f)); });
    document.getElementById(`r${ci}`).innerHTML =
      `<div><span>Apostado Real:</span><span>${fmt(t.real)} €</span></div>
       <div><span>Apostado FB:</span><span>${fmt(t.fb)} €</span></div>
       <div><span>Profit Total:</span><span>${fmt(t.profit)} €</span></div>
       <div class="ben"><span>Beneficio Real:</span><span>${fmt(t.profit - totalReal)} €</span></div>`;
  });
}

function render() {
  const cont = document.getElementById('cols');
  cont.innerHTML = '';
  estado.cols.forEach((col, ci) => {
    const el = document.createElement('div');
    el.className = 'col';
    el.innerHTML = `<h2>${col.titulo}</h2>
      <input class="nombre" data-ci="${ci}" value="${esc(col.nombre)}" ${col.fijo ? 'readonly' : ''}>
      <table><thead><tr><th>Bookie</th><th>Tipo</th><th>Importe (€)</th><th>Cuota</th><th>Neto (€)</th></tr></thead>
      <tbody>${col.filas.map((f, fi) => `<tr>
        <td><input data-ci="${ci}" data-fi="${fi}" data-k="b" value="${esc(f.b)}"></td>
        <td><select data-ci="${ci}" data-fi="${fi}" data-k="t">
            <option value="R" ${f.t === 'R' ? 'selected' : ''}>R</option>
            <option value="F" ${f.t === 'F' ? 'selected' : ''}>F</option></select></td>
        <td><input inputmode="decimal" data-ci="${ci}" data-fi="${fi}" data-k="i" value="${esc(f.i)}"></td>
        <td><input inputmode="decimal" data-ci="${ci}" data-fi="${fi}" data-k="c" value="${esc(f.c)}"></td>
        <td id="n${ci}_${fi}"></td></tr>`).join('')}</tbody></table>
      <div class="botones">
        <button class="add" data-add="${ci}">＋ Añadir fila</button>
        <button class="del" data-del="${ci}">🗑️ Eliminar</button></div>
      <div class="resumen" id="r${ci}"></div><div class="espacio"></div>`;
    cont.appendChild(el);
  });
  pintarCalculos();
}

document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.k) estado.cols[d.ci].filas[d.fi][d.k] = e.target.value;
  else if (d.ci !== undefined && e.target.classList.contains('nombre')) estado.cols[d.ci].nombre = e.target.value;
  else return;
  guardar(); pintarCalculos();
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.add !== undefined) estado.cols[b.dataset.add].filas.push({ b: '', t: 'R', i: '', c: '' });
  else if (b.dataset.del !== undefined) { const f = estado.cols[b.dataset.del].filas; if (f.length > 1) f.pop(); }
  else return;
  guardar(); render();
});
document.getElementById('foto').addEventListener('click', () => {
  html2canvas(document.getElementById('captura'), { scale: 2, backgroundColor: '#f5f5f5' }).then(c => {
    const a = document.createElement('a');
    a.download = 'mi_apuesta.png'; a.href = c.toDataURL('image/png'); a.click();
  });
});
render();
</script>
</body>
</html>
